plugins {
    id 'dev.architectury.loom-no-remap'
    id 'architectury-plugin'
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    splitEnvironmentSourceSets()

    mods {
        tums {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration are bundled into the final jar.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

    common(project(':common')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    common project(':core')
    shadowBundle project(':core')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': inputs.properties.version
    }
}

shadowJar {
    from sourceSets.client.output
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = ''
}

jar {
    archiveClassifier = 'slim'
}

assemble.dependsOn shadowJar
