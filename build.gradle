plugins {
    id 'base'
    id 'architectury-plugin' version '3.5-SNAPSHOT'
    id 'dev.architectury.loom-no-remap' version '1.17-SNAPSHOT' apply false
    id 'com.gradleup.shadow' version '9.4.3' apply false
    id 'xyz.jpenilla.run-paper' version '3.0.2' apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = project.maven_group
    version = project.mod_version
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'maven-publish'

    base {
        archivesName = "${rootProject.archives_base_name}-${project.name}"
    }

    repositories {
        mavenCentral()
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 25
        it.options.encoding = 'UTF-8'
    }

    // The wiki pages under docs/developer are generated from class javadoc (see docs/generate.sh),
    // which carries the page title and summary as these tags.
    tasks.withType(Javadoc).configureEach {
        options.tags('tums.title:t:Wiki title:', 'tums.summary:t:Wiki summary:')
    }

    jar {
        from(rootProject.file('LICENSE.txt')) {
            rename { "${it}_${rootProject.archives_base_name}" }
        }
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }
    }
}

// One universal jar for Fabric, NeoForge and Spigot/Paper: build/libs/tums-<version>.jar
// Each loader only reads its own metadata (fabric.mod.json / META-INF/neoforge.mods.toml / plugin.yml)
// and only loads its own entrypoint, so the other platforms' classes are never touched.
def mergedPlatforms = ['fabric', 'neoforge', 'paper']

tasks.register('mergedJar', Jar) {
    group = 'build'
    description = 'Merges the Fabric, NeoForge and Paper jars into one universal jar.'

    archiveBaseName = rootProject.archives_base_name
    archiveVersion = project.version.toString()
    destinationDirectory = layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    mergedPlatforms.each { name ->
        def platformJar = project(":$name").tasks.named('shadowJar')
        dependsOn platformJar
        from({ zipTree(platformJar.get().archiveFile) }) {
            // Architectury's @ExpectPlatform glue differs per loader; Tums doesn't use @ExpectPlatform.
            // If you add @ExpectPlatform methods later, ship per-loader jars instead.
            exclude 'architectury_inject_*/**'
            exclude 'META-INF/MANIFEST.MF'
        }
    }
}

tasks.named('assemble') { dependsOn 'mergedJar' }
