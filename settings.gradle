pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'tums'

include 'core'     // pure-Java Tusan lexer/interpreter + Tums language (no Minecraft dependency)
include 'common'   // Architectury common code (Minecraft-dependent, loader-agnostic)
include 'fabric'
include 'neoforge'
include 'paper'    // Spigot/Paper plugin

// Modules live under src/
['core', 'common', 'fabric', 'neoforge', 'paper'].each { project(":$it").projectDir = file("src/$it") }
